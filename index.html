<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tri des joueuses — Volleyball</title>
<style>
  :root{
    --navy: #1A2632;
    --navy-2: #8FA8CC;
    --court: #101A22;
    --yellow: #F8AE1B;
    --yellow-dim: #D6930F;
    --paper: #1F2C3A;
    --card: #253746;
    --line: #34495B;
    --text: #F2F4F7;
    --text-dim: #9DAEC0;
    --confirmee: #4ADE80;
    --confirmee-bg: rgba(74, 222, 128, 0.14);
    --essai: #F8AE1B;
    --essai-bg: rgba(248, 174, 27, 0.14);
    --coupee: #F87171;
    --coupee-bg: rgba(248, 113, 113, 0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #14202B;
    color: var(--text);
  }
  .app{ max-width: 920px; margin: 0 auto; padding: 20px 16px 60px; }

  header.top{
    background: linear-gradient(135deg, var(--navy) 0%, var(--court) 100%);
    border-radius: 14px;
    padding: 22px 24px;
    color: white;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
    display:flex;
    align-items:center;
    gap: 16px;
  }
  header.top::after{
    content:"";
    position:absolute; right:-40px; top:-40px;
    width:160px; height:160px; border-radius:50%;
    background: radial-gradient(circle, rgba(248,174,27,0.25) 0%, transparent 70%);
  }
  .logo-img{
    width: 56px; height:56px; border-radius:50%; flex-shrink:0;
    box-shadow: 0 0 0 2px rgba(248,174,27,0.4);
  }
  header.top h1{
    margin:0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em;
  }
  header.top p{ margin:0; color: #A9AEC4; font-size: 13.5px; }
  .stats{ display:flex; gap: 18px; margin-top: 14px; flex-wrap: wrap; }
  .stat{ font-size: 12.5px; color:#A9AEC4; }
  .stat b{ color: var(--yellow); font-size: 15px; display:block; }

  .toolbar{
    display:flex; gap:8px; flex-wrap: wrap; margin-bottom: 14px; align-items:center;
  }
  .toolbar .group{ display:flex; gap:6px; flex-wrap: wrap; }
  .chip-btn{
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12.5px;
    cursor: pointer;
    transition: all .15s ease;
    white-space: nowrap;
  }
  .chip-btn:hover{ border-color: var(--navy-2); }
  .chip-btn.active{
    background: var(--yellow);
    border-color: var(--yellow);
    color: #16151A;
  }
  .spacer{ flex:1; }
  .save-note{ font-size:11.5px; color: var(--text-dim); display:flex; align-items:center; gap:6px; }
  .dot{ width:6px; height:6px; border-radius:50%; background: #4A4A54; }
  .dot.ok{ background: var(--confirmee); }

  .teams{
    display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px;
  }
  @media (max-width: 620px){ .teams{ grid-template-columns: 1fr; } }
  .team-card{
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    overflow:hidden;
  }
  .team-head{
    padding: 12px 14px; display:flex; align-items:center; justify-content:space-between;
    background: var(--navy); color:white;
  }
  .team-head.over{ background: var(--coupee); }
  .team-head h3{ margin:0; font-size: 14px; font-weight:700; }
  .team-count{ font-size: 12.5px; font-weight:700; font-variant-numeric: tabular-nums; }
  .team-status{
    padding: 8px 14px; font-size: 12px; font-weight:600;
    border-bottom: 1px solid var(--line);
    display:flex; align-items:center; gap:6px;
  }
  .team-status.free{ color: var(--confirmee); background: var(--confirmee-bg); }
  .team-status.full{ color: var(--text-dim); background: var(--paper); }
  .team-status.over{ color: var(--coupee); background: var(--coupee-bg); }
  .team-body{ padding: 4px 0; }
  .team-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 6px 14px; font-size: 13px;
  }
  .team-row:not(:last-child){ border-bottom: 1px solid var(--line); }
  .team-row .t-num{ color: var(--text-dim); font-size: 11.5px; width: 18px; }
  .team-row .t-name{ flex:1; margin-left:4px; }
  .team-row .t-sec{ font-size: 11px; color: var(--text-dim); }
  .team-row.overflow-row{ background: var(--coupee-bg); }
  .team-row.overflow-row .t-name, .team-row.overflow-row .t-num{ color: var(--coupee); font-weight:600; }
  .team-row.essai-row .t-name, .team-row.essai-row .t-num{ color: var(--essai); font-weight:600; }
  .team-divider{
    padding: 8px 14px 3px; font-size: 10.5px; font-weight:700; color: var(--essai);
    letter-spacing: 0.02em;
  }
  .team-empty{ padding: 14px; font-size: 12.5px; color: var(--text-dim); text-align:center; }

  .list{ display:flex; flex-direction:column; gap:8px; }

  .row{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    display:grid;
    grid-template-columns: 34px 26px 1fr;
    align-items:center;
    gap: 10px;
    transition: box-shadow .15s ease, transform .15s ease, opacity .15s ease;
  }
  .row.dragging{ opacity: .4; }
  .row.drag-over{ box-shadow: 0 0 0 2px var(--yellow) inset; }
  .row.cut{ opacity: .55; }

  .handle{
    cursor: grab;
    color: #55555F;
    font-size: 16px;
    text-align:center;
    user-select:none;
    touch-action: none;
    line-height:1;
    padding: 4px;
  }
  .handle:active{ cursor: grabbing; }

  .order-num{
    font-weight:700; font-size: 14px; color: var(--navy-2);
    background: var(--paper);
    border-radius:6px;
    width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    font-variant-numeric: tabular-nums;
  }

  .info{ min-width:0; }
  .name{ font-weight:600; font-size: 14.5px; color: var(--text); }
  .meta{ display:flex; align-items:center; gap:8px; margin-top:3px; flex-wrap:wrap; }
  .sec-badge{
    font-size: 11px; font-weight:600; color: var(--navy-2);
    background: rgba(143,168,204,0.18); padding: 1px 7px; border-radius: 5px;
    white-space:nowrap;
  }
  .tags{ display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
  .tag{
    font-size: 10.5px; font-weight:600; padding: 2px 8px; border-radius: 20px;
    white-space:nowrap;
  }
  .tag.confirmee{ background: var(--confirmee-bg); color: var(--confirmee); }
  .tag.essai{ background: var(--essai-bg); color: var(--essai); }
  .tag.coupee{ background: var(--coupee-bg); color: var(--coupee); }

  .pill{
    font-size: 10.5px; font-weight:600; padding: 3px 9px; border-radius: 20px;
    white-space:nowrap; border: 1px solid var(--line); background: var(--card);
    color: #6B6B76; cursor:pointer; transition: all .12s ease; line-height:1.3;
  }
  .pill:hover{ border-color: #55555F; color: var(--text-dim); }
  .pill.active.essai{ background: var(--essai-bg); color: var(--essai); border-color: transparent; }
  .pill.active.confirmee{ background: var(--confirmee-bg); color: var(--confirmee); border-color: transparent; }
  .pill.cut-pill.active{ background: var(--coupee-bg); color: var(--coupee); border-color: transparent; }

  .empty{ text-align:center; padding: 40px 20px; color: var(--text-dim); font-size:14px; }

  @media (max-width: 480px){
    .row{ grid-template-columns: 26px 24px 1fr auto; padding: 9px 8px; }
    .name{ font-size:13.5px; }
  }
</style>
</head>

async function loadState() {

function scheduleSave() {
  const dot = document.getElementById("saveDot");
  const text = document.getElementById("saveText");
  dot.classList.remove("ok");
  text.textContent = "Sauvegarde…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(players), false);
      dot.classList.add("ok");
      text.textContent = "Sauvegardé";
    } catch (e) {
      text.textContent = "Erreur de sauvegarde";
    }
  }, 350);
}

function renderStats() {
  const total = players.length;
  const cadettes = players.filter(p => p.tags.includes("cadette-confirmee") || p.tags.includes("cadette-essai")).length;
  const benjamines = players.filter(p => p.tags.includes("benjamine-confirmee") || p.tags.includes("benjamine-essai")).length;
  const cut = players.filter(p => p.tags.includes(CUT_ID)).length;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${total}</b>joueuses</div>
    <div class="stat"><b>${cadettes}</b>cadettes</div>
    <div class="stat"><b>${benjamines}</b>benjamines</div>
    <div class="stat"><b>${cut}</b>coupées</div>
  `;
}

function renderFilters() {
  const secBox = document.getElementById("filterSec");
  const secs = ["all", 1, 2, 3, 4];
  secBox.innerHTML = secs.map(s => `
    <button class="chip-btn ${filterSec == s ? 'active' : ''}" data-sec="${s}">
      ${s === "all" ? "Toutes sections" : "Sec. " + s}
    </button>
  `).join("");
  secBox.querySelectorAll("button").forEach(b => {
    b.onclick = () => { filterSec = b.dataset.sec === "all" ? "all" : Number(b.dataset.sec); render(); };
  });

  const tagBox = document.getElementById("filterTag");
  const tagOpts = [{id:"all", label:"Tous statuts"}, ...STATUS_OPTIONS, {id:CUT_ID, label:"Coupée"}];
  tagBox.innerHTML = tagOpts.map(t => `
    <button class="chip-btn ${filterTag === t.id ? 'active' : ''}" data-tag="${t.id}">${t.label}</button>
  `).join("");
  tagBox.querySelectorAll("button").forEach(b => {
    b.onclick = () => { filterTag = b.dataset.tag; render(); };
  });
}

function tagLabel(id) {
  if (id === CUT_ID) return { label: "Coupée", cls: "coupee" };
  const found = STATUS_OPTIONS.find(t => t.id === id);
  return found ? { label: found.label, cls: found.cls } : null;
}

function renderList() {
  const list = document.getElementById("list");
  const emptyMsg = document.getElementById("emptyMsg");
  let visible = players.filter(p => {
    if (filterSec !== "all" && p.sec !== filterSec) return false;
    if (filterTag !== "all" && !p.tags.includes(filterTag)) return false;
    return true;
  });

  if (visible.length === 0) {
    list.innerHTML = "";
    emptyMsg.style.display = "block";
    return;
  }
  emptyMsg.style.display = "none";

  list.innerHTML = visible.map((p) => {
    const globalIndex = players.findIndex(x => x.id === p.id);
    const isCut = p.tags.includes(CUT_ID);
    const opts = availableOptions(p);

    const pillsHtml = opts.map(opt => {
      const active = p.tags.includes(opt.id);
      return `<button class="pill ${opt.cls} ${active ? "active" : ""}" data-toggle="${opt.id}" data-owner="${p.id}">${opt.label}</button>`;
    }).join("");

    const cutPill = `<button class="pill cut-pill ${isCut ? "active" : ""}" data-toggle="${CUT_ID}" data-owner="${p.id}">Coupée</button>`;

    return `
      <div class="row ${isCut ? 'cut' : ''}" draggable="true" data-id="${p.id}">
        <div class="handle" title="Glisser pour réordonner">⠿</div>
        <div class="order-num">${globalIndex + 1}</div>
        <div class="info">
          <div class="name">${p.name}</div>
          <div class="meta">
            <span class="sec-badge">Sec. ${p.sec}</span>
            <div class="tags">${pillsHtml}${cutPill}</div>
          </div>
        </div>
      </div>
    `;
  }).join("");

  attachRowEvents();
}

function attachRowEvents() {
  const list = document.getElementById("list");

  list.querySelectorAll(".pill").forEach(pill => {
    pill.onclick = (e) => {
      e.stopPropagation();
      const owner = pill.dataset.owner;
      const tagId = pill.dataset.toggle;
      const player = players.find(p => p.id === owner);
      if (!player) return;
      if (player.tags.includes(tagId)) {
        player.tags = player.tags.filter(t => t !== tagId);
      } else {
        player.tags.push(tagId);
      }
      renderStats();
      renderTeams();
      renderList();
      scheduleSave();
    };
  });

  list.querySelectorAll(".row").forEach(row => {
    row.addEventListener("dragstart", (e) => {
      dragId = row.dataset.id;
      row.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    row.addEventListener("dragend", () => {
      row.classList.remove("dragging");
      list.querySelectorAll(".row").forEach(r => r.classList.remove("drag-over"));
    });
    row.addEventListener("dragover", (e) => {
      e.preventDefault();
      if (row.dataset.id !== dragId) row.classList.add("drag-over");
    });
    row.addEventListener("dragleave", () => row.classList.remove("drag-over"));
    row.addEventListener("drop", (e) => {
      e.preventDefault();
      row.classList.remove("drag-over");
      const targetId = row.dataset.id;
      if (!dragId || dragId === targetId) return;
      reorder(dragId, targetId);
    });
  });
}

function reorder(fromId, toId) {
  const fromIdx = players.findIndex(p => p.id === fromId);
  const toIdx = players.findIndex(p => p.id === toId);
  if (fromIdx === -1 || toIdx === -1) return;
  const [moved] = players.splice(fromIdx, 1);
  players.splice(toIdx, 0, moved);
  render();
  scheduleSave();
}

function renderTeams() {
  const container = document.getElementById("teams");
  container.innerHTML = TEAM_DEFS.map(def => {
    const excluded = p => def.excludeTag && p.tags.includes(def.excludeTag);

    const members = players.filter(p =>
      p.tags.includes(def.confirmedTag) && !p.tags.includes(CUT_ID) && !excluded(p)
    );
    const tryouts = players.filter(p =>
      p.tags.includes(def.essaiTag) && !p.tags.includes(def.confirmedTag) && !p.tags.includes(CUT_ID) && !excluded(p)
    );

    const total = members.length + tryouts.length;
    const free = TEAM_MAX - total;
    const headClass = total > TEAM_MAX ? "over" : "";

    let statusHtml;
    if (total > TEAM_MAX) {
      statusHtml = `<div class="team-status over">⚠ ${total - TEAM_MAX} place${total - TEAM_MAX > 1 ? "s" : ""} en trop</div>`;
    } else if (total === TEAM_MAX) {
      statusHtml = `<div class="team-status full">Équipe complète (12/12)</div>`;
    } else {
      statusHtml = `<div class="team-status free">${free} place${free > 1 ? "s" : ""} libre${free > 1 ? "s" : ""}</div>`;
    }

    const confirmedRowsHtml = members.map((p, i) => {
      const isOverflow = (i + 1) > TEAM_MAX;
      return `
        <div class="team-row ${isOverflow ? "overflow-row" : ""}">
          <span class="t-num">${i + 1}</span>
          <span class="t-name">${p.name}</span>
          <span class="t-sec">Sec. ${p.sec}</span>
        </div>
      `;
    }).join("");

    const tryoutRowsHtml = tryouts.map((p, i) => {
      const pos = members.length + i + 1;
      const isOverflow = pos > TEAM_MAX;
      return `
          <div class="team-row essai-row ${isOverflow ? "overflow-row" : ""}">
            <span class="t-num">${pos}</span>
            <span class="t-name">${p.name}</span>
            <span class="t-sec">Sec. ${p.sec}</span>
          </div>
        `;
    }).join("");

    const rowsHtml = (confirmedRowsHtml || tryoutRowsHtml)
      ? confirmedRowsHtml + tryoutRowsHtml
      : `<div class="team-empty">Aucune joueuse confirmée</div>`;

    return `
      <div class="team-card">
        <div class="team-head ${headClass}">
          <h3>${def.label}</h3>
          <span class="team-count">${total}/${TEAM_MAX}</span>
        </div>
        ${statusHtml}
        <div class="team-body">${rowsHtml}</div>
      </div>
    `;
  }).join("");
}

function render() {
  renderStats();
  renderTeams();
  renderFilters();
  renderList();
}

loadState();
</script>
</body>
</html>
